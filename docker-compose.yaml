version: "3.9"
volumes:
  HNG-nginx-logs:
    name: HNG-nginx-logs
  nextcloud-data:

services:
  nextcloud:
    image: kefaslungu/hng-nextcloud:latest
    container_name: hng-nextcloud
    restart: unless-stopped
    volumes:
      - nextcloud-data:/var/www/html
      - HNG-nginx-logs:/var/log/nginx:ro
    environment:
      - NEXTCLOUD_TRUSTED_DOMAINS=localhost
    expose:
      - "80"
  nginx:
    image: nginx:1.25-alpine
    container_name: hng-nginx
    restart: unless-stopped
    depends_on:
      - nextcloud
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - HNG-nginx-logs:/var/log/nginx
    networks:
      - default
  detector:
    build:
      context: ./detector
      dockerfile: Dockerfile
    container_name: hng-detector
    restart: unless-stopped
    depends_on:
      - nginx
    cap_add:
      - NET_ADMIN 
    network_mode: host
    volumes:
      - HNG-nginx-logs:/var/log/nginx:ro
      - ./detector:/app
    working_dir: /app
    command: python main.py

networks:
  default:
    driver: bridge